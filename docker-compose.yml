version: '3.9'

services:
  softkify-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softkify-fe-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Opcional: Servicio nginx para proxy inverso (más profesional)
