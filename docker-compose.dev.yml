version: '3.9'

services:
  softkify-frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: softkify-fe-dev
    ports:
      - "5173:5173"  # Puerto de Vite en desarrollo
    volumes:
      - .:/app  # Sincronizar todo el código
      - /app/node_modules  # No sincronizar node_modules
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
    restart: unless-stopped
    command: npm run dev
